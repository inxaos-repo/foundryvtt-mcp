name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/inxaos-repo/foundryvtt-mcp:${{ steps.tag.outputs.sha }}
            ghcr.io/inxaos-repo/foundryvtt-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "IMAGE_TAG=ghcr.io/inxaos-repo/foundryvtt-mcp:${{ steps.tag.outputs.sha }}"
